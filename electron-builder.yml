appId: com.flow.desktop
productName: Flow
asar: true
npmRebuild: false

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - resources/**
  - package.json

win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: Flow-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  shortcutName: Flow

mac:
  target:
    - dmg
  icon: build/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Utility
