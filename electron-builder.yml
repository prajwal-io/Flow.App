appId: com.flow.desktop
productName: Flow
asar: true
npmRebuild: false

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - resources/**
  - package.json

win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: Flow-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  shortcutName: Flow

mac:
  target:
    - dmg
  icon: build/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Utility

# electron-updater reads this (as app-update.yml inside the package) to find
# new releases on GitHub.
publish:
  provider: github
  owner: prajwal-io
  repo: Flow.App
